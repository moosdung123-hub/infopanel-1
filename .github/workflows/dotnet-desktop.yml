# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: 
      - main
      - master
      - all-changes
    tags: '*'
  pull_request:
    branches: '**'
  workflow_dispatch:  # Allow manual triggering

jobs:
  build:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        cache: true
        cache-dependency-path: '**/packages.lock.json'

    # Temporary hardware test patch for Peerless Assassin 120 VISION BLACK.
    # TRCC 2.1.8 protocol audit maps HID Type 2 PM=53 (0x35) to the
    # 320x240 RGB565 family, but the wire frame is sent as 240x320 after
    # the device-family 90-degree transform. The previous 320x240 wire
    # dimensions caused row/stride corruption on real hardware.
    - name: Apply PA120 Vision PM 0x35 test fix v2
      shell: powershell
      run: |
        $path = "InfoPanel/ThermalrightPanel/ThermalrightPanelModelDatabase.cs"
        $lines = Get-Content -Path $path
        $inside = $false
        $pixelFormatInserted = $false
        $result = foreach ($line in $lines) {
          if ($line -match '\[ThermalrightPanelModel\.BA120VisionB\]') {
            $inside = $true
          }

          if ($inside -and $line -match '^\s*Width\s*=\s*320,') {
            $line -replace 'Width\s*=\s*320,', 'Width = 240,'
            continue
          }

          if ($inside -and $line -match '^\s*Height\s*=\s*320,') {
            $line
            continue
          }

          if ($inside -and $line -match '^\s*RenderWidth\s*=\s*320,') {
            $line -replace 'RenderWidth\s*=\s*320,', 'RenderWidth = 240,'
            continue
          }

          if ($inside -and $line -match '^\s*RenderHeight\s*=\s*320,') {
            $line
            continue
          }

          if ($inside -and -not $pixelFormatInserted -and $line -match '^\s*ProtocolType\s*=\s*ThermalrightProtocolType\.Trofeo,') {
            $line
            '                PixelFormat = ThermalrightPixelFormat.Rgb565,'
            $pixelFormatInserted = $true
            continue
          }

          if ($inside -and $line -match 'PmByte\s*=\s*TROFEO_BA120B_PM_BYTE') {
            $inside = $false
          }

          $line
        }

        if (-not $pixelFormatInserted) {
          throw "PA120 Vision patch target was not found; refusing to build an unpatched binary."
        }

        Set-Content -Path $path -Value $result -Encoding utf8

        # Keep source comments consistent with the tested mapping.
        $text = Get-Content -Path $path -Raw
        $text = $text.Replace('TROFEO_BA120B_PM_BYTE      = 0x35;  //  53 -> 320x320, Jpeg ("LF20/LF21/LF22")', 'TROFEO_BA120B_PM_BYTE      = 0x35;  //  53 -> 240x320 wire frame, RGB565 ("LF20/LF21/LF22")')
        $text = $text.Replace('PM 0x35 (53): TRCC bulk table = "LF20/LF21/LF22" 320x320 Jpeg', 'PM 0x35 (53): TRCC HID Type 2 = "LF20/LF21/LF22" 320x240 panel / 240x320 RGB565 wire frame')
        Set-Content -Path $path -Value $text -Encoding utf8

        Write-Host "Applied PM 0x35 v2 patch. Relevant lines:"
        Select-String -Path $path -Pattern 'BA120VisionB|Name = "LF20"|Width = 240|Height = 320|RenderWidth = 240|RenderHeight = 320|PixelFormat = ThermalrightPixelFormat.Rgb565|TROFEO_BA120B_PM_BYTE' -Context 0,1

    # Cache NuGet packages
    # - name: Cache NuGet packages
    #   uses: actions/cache@v4
    #   with:
    #     path: ~/.nuget/packages
    #     key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
    #     restore-keys: |
    #       ${{ runner.os }}-nuget-

    - name: Build InfoPanel
      run: |
        dotnet restore --force-evaluate
        dotnet publish InfoPanel/InfoPanel.csproj -c Release -r win-x64 --self-contained -p:PublishProfile=FolderProfile -p:Platform=x64

    - name: Install and Compile Inno Setup Installer
      shell: powershell
      run: |
        cd ${{ github.workspace }}\InnoSetup
        iscc "setup.iss"      

    - name: Upload Artifact Setup
      uses: actions/upload-artifact@v4
      with:
        name: InfoPanel-Setup-${{ github.sha }}
        path: "${{ github.workspace }}/InnoSetup/Output/InfoPanelSetup.exe"
        retention-days: 90

    ###################################
    # Everything below is only for tagged Releases
    ###################################
    - name: Generate Release Notes
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      run: |
        TAG="${GITHUB_REF#refs/tags/}"
        RESPONSE=$(curl -sf --max-time 120 -X POST \
          "https://api.infopanel.net/v1/github/releases/${TAG}/notes" \
          -H "Authorization: Bearer ${{ secrets.INFOPANEL_GH_ACTIONS_SECRET }}" \
          -H "Content-Type: application/json") || true

        if [ -n "$RESPONSE" ]; then
          echo "$RESPONSE" | jq -r '.notes' > release_notes.md
          echo "Generated release notes:"
          cat release_notes.md
        else
          echo "::warning::Release notes generation failed, using GitHub default"
          echo "" > release_notes.md
        fi

    - name: Upload Release Asset
      if: startsWith(github.ref, 'refs/tags/')
      id: upload-release-asset
      uses: ncipollo/release-action@v1
      with:
        artifacts: ${{ github.workspace }}/InnoSetup/Output/InfoPanelSetup.exe
        bodyFile: release_notes.md
        generateReleaseNotes: false
        allowUpdates: true
        draft: false
        prerelease: ${{ contains(github.ref, '-') }}